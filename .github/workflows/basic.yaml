name: Develop Test

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'

defaults:
  run:
    shell: nu {0}

jobs:
  basic-usage:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: hustcer/setup-nu@develop
      with:
        version: '*'
        enable-plugins: true
    - run: print (version); print $"(char nl)Dir contents:(char nl)"; ls ($nu.current-exe | path dirname)
    - run: |
        print $'Current env:(char nl)'
        print $env
    - name: You can run bash commands, too
      run: pwd && ls -la
      shell: bash

  # Pinning by commit SHA, and a version older than the newest page of releases
  test-pinned-version:
    strategy:
      matrix:
        include:
          - ver: '0df4ca2'  # Commit SHA of the 0.114.1 stable release
            expected: '0.114.1'
          - ver: '0.86.0'
            expected: '0.86.0'

    runs-on: ubuntu-22.04
    name: test (ubuntu-22.04, nu@${{matrix.ver}})
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Setup nu@${{matrix.ver}}
      uses: hustcer/setup-nu@develop
      with:
        version: ${{matrix.ver}}
    - name: Check the resolved Nu version
      run: |
        let current = (version).version
        print $'Nu version: ($current)'
        if $current != '${{matrix.expected}}' {
          error make {msg: $'Expected ${{matrix.expected}}, but got ($current)'}
        }

  test-dev-matrix:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    name: test (${{matrix.os}}, setup-nu@latest-dev)
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Setup nu@latest
      uses: hustcer/setup-nu@develop
      with:
        check-latest: true
        enable-plugins: true
      env:
        ACTIONS_STEP_DEBUG: true
    - name: You can run bash commands, too
      run: pwd && ls -la
      shell: bash
    - name: Default shell will be `nu`
      run: |
        print $'Nu version info:(char nl)'; print (version)
        print $'Current env:(char nl)'; print $env
        print 'Current NU_LIB_DIRS:'
        print $env.NU_LIB_DIRS
        print $'Nu path:(which nu)(char nl)'
        print $"(char nl)Dir contents:(char nl)"; print (ls ($nu.current-exe | path dirname))
        def greeting [name: string] {
          print $'Hello ($name)'
        }
        greeting hustcer
