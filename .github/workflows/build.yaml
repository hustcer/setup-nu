name: Assets Build and Test

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Setup nu
      uses: hustcer/setup-nu@v3
    - name: Build Setup Script
      run: |
        npm i -g pnpm@10
        pnpm i
        pnpm run lint
        pnpm run build
        npx skills add -y -g hustcer/nushell-pro --agent claude-code
    # The action runs `dist/index.js`, a stale bundle means the published action does not match
    # the sources. `src/plugins.ts` is generated from `nu/register-plugins.nu` by the same build.
    - name: Verify the committed build output is up to date
      run: |
        if [ -n "$(git status --porcelain dist src/plugins.ts)" ]; then
          echo "::error::dist/ or src/plugins.ts is out of date, run 'pnpm run build' and commit the result"
          git --no-pager diff --stat dist src/plugins.ts
          exit 1
        fi
        echo 'Build output is in sync with the sources.'

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        crate:
          - { owner: nushell, name: nushell }

    runs-on: ${{ matrix.os }}
    name: test (${{matrix.os}}, ${{ matrix.crate.owner }}/${{ matrix.crate.name }})
    steps:
    - uses: actions/checkout@v7
    - name: Setup ${{ matrix.crate.owner }}/${{ matrix.crate.name }}
      uses: ./
      with:
        version: v0.98.0
        enable-plugins: true
      env:
        ACTIONS_STEP_DEBUG: true
    - name: Show Nu Path and Related Assets
      run: which $(printf nu | tr '[:upper:]' '[:lower:]') && echo "Dir contents --->:" && ls -la "$(dirname `which nu`)"
      shell: bash
    - name: Spawn a Nu Session and Display Version Info
      run: nu -c 'print (version); print $"(char nl)Dir contents:(char nl)"; ls ($nu.current-exe | path dirname)'
      shell: bash
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#custom-shell
    - name: Use Nu as Default Shell
      shell: nu {0}
      run: |
        print $'Current env:(char nl)'
        print $env
